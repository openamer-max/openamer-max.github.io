<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="OpenAmer-Max-Ultra — Serverschrank mit vier Beschleunigerkarten">
  <defs>
    <linearGradient id="u_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="u_case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a3d"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="u_edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57e0c4"/>
      <stop offset="100%" stop-color="#5b8cff"/>
    </linearGradient>
    <linearGradient id="u_gpu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#57e0c4" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5b8cff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#u_bg)"/>
  <ellipse cx="200" cy="214" rx="126" ry="16" fill="#57e0c4" opacity="0.09"/>

  <!-- Schrank, hoeher als der Pro-Rechner: eine Stufe weiter oben -->
  <rect x="124" y="30" width="152" height="176" rx="10" fill="url(#u_case)" stroke="url(#u_edge)" stroke-width="1.6"/>
  <!-- Lueftungsgitter -->
  <g stroke="#3a3a52" stroke-width="1.2" opacity="0.9">
    <line x1="140" y1="44" x2="260" y2="44"/>
    <line x1="140" y1="51" x2="260" y2="51"/>
  </g>
  <!-- vier Beschleunigerkarten statt zwei -->
  <g>
    <rect x="140" y="66" width="120" height="22" rx="4" fill="url(#u_gpu)"/>
    <circle cx="154" cy="77" r="6" fill="#0d0d15" opacity="0.55"/>
    <circle cx="172" cy="77" r="6" fill="#0d0d15" opacity="0.55"/>
    <rect x="140" y="96" width="120" height="22" rx="4" fill="url(#u_gpu)" opacity="0.86"/>
    <circle cx="154" cy="107" r="6" fill="#0d0d15" opacity="0.55"/>
    <circle cx="172" cy="107" r="6" fill="#0d0d15" opacity="0.55"/>
    <rect x="140" y="126" width="120" height="22" rx="4" fill="url(#u_gpu)" opacity="0.72"/>
    <circle cx="154" cy="137" r="6" fill="#0d0d15" opacity="0.55"/>
    <circle cx="172" cy="137" r="6" fill="#0d0d15" opacity="0.55"/>
    <rect x="140" y="156" width="120" height="22" rx="4" fill="url(#u_gpu)" opacity="0.58"/>
    <circle cx="154" cy="167" r="6" fill="#0d0d15" opacity="0.55"/>
    <circle cx="172" cy="167" r="6" fill="#0d0d15" opacity="0.55"/>
  </g>
  <!-- Statusleiste: fast voll, aber nicht ganz - 41 von 45 -->
  <rect x="140" y="186" width="120" height="6" rx="3" fill="#2f2f45"/>
  <rect x="140" y="186" width="109" height="6" rx="3" fill="url(#u_edge)"/>
  <rect x="150" y="212" width="100" height="7" rx="3" fill="#232333"/>

  <text x="200" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" letter-spacing="3" fill="#8d8da8">30 – 100 B · 18,5 GB</text>
</svg>
