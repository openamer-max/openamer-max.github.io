<svg width="400" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" role="img" aria-label="OpenAmer-Max-Phone — Smartphone (in Arbeit)">
  <defs>
    <linearGradient id="pAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="pGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="400" height="260" rx="16" fill="#0f1219"/>
  <circle cx="200" cy="126" r="108" fill="url(#pGlow)"/>

  <!-- Gehäuse -->
  <rect x="152" y="28" width="96" height="188" rx="18" fill="#1b2130" stroke="url(#pAccent)" stroke-width="2.2" stroke-dasharray="0"/>
  <!-- Display -->
  <rect x="160" y="38" width="80" height="168" rx="13" fill="#070a12"/>
  <!-- Notch -->
  <rect x="186" y="44" width="28" height="6" rx="3" fill="#232b3d"/>

  <!-- Chat-Andeutung -->
  <rect x="168" y="66" width="46" height="16" rx="8" fill="#1d2536"/>
  <rect x="186" y="88" width="46" height="16" rx="8" fill="#2b3446"/>
  <rect x="168" y="110" width="34" height="16" rx="8" fill="#1d2536"/>
  <rect x="168" y="140" width="62" height="5" rx="2.5" fill="#2a3346"/>
  <rect x="168" y="151" width="50" height="5" rx="2.5" fill="#1f2735"/>

  <!-- Fragezeichen als "in Arbeit" -->
  <circle cx="200" cy="182" r="13" fill="none" stroke="url(#pAccent)" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="200" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="15" font-weight="700" fill="#7c8cad">?</text>

  <text x="200" y="240" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="600" fill="#6f7c92" letter-spacing="2.5">1 – 5B</text>
</svg>
