<svg xmlns="http://www.w3.org/2000/svg" width="400" height="260" viewBox="0 0 400 260" role="img" aria-label="OpenAmer-Max-Pro — Arbeitsplatzrechner mit zwei Grafikkarten">
  <defs>
    <linearGradient id="p_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#12121c"/>
      <stop offset="100%" stop-color="#0b0b12"/>
    </linearGradient>
    <linearGradient id="p_case" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a2a3d"/>
      <stop offset="100%" stop-color="#1a1a28"/>
    </linearGradient>
    <linearGradient id="p_edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff"/>
      <stop offset="100%" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="p_gpu" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5b8cff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a06bff" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="400" height="260" fill="url(#p_bg)"/>
  <ellipse cx="200" cy="212" rx="118" ry="16" fill="#a06bff" opacity="0.10"/>

  <!-- Gehaeuse -->
  <rect x="126" y="42" width="148" height="164" rx="10" fill="url(#p_case)" stroke="url(#p_edge)" stroke-width="1.6"/>
  <!-- Lueftungsgitter oben -->
  <g stroke="#3a3a52" stroke-width="1.2" opacity="0.9">
    <line x1="142" y1="58" x2="258" y2="58"/>
    <line x1="142" y1="66" x2="258" y2="66"/>
    <line x1="142" y1="74" x2="258" y2="74"/>
  </g>
  <!-- zwei Grafikkarten -->
  <rect x="142" y="92" width="116" height="24" rx="4" fill="url(#p_gpu)"/>
  <circle cx="156" cy="104" r="7" fill="#0d0d15" opacity="0.55"/>
  <circle cx="176" cy="104" r="7" fill="#0d0d15" opacity="0.55"/>
  <rect x="142" y="126" width="116" height="24" rx="4" fill="url(#p_gpu)" opacity="0.72"/>
  <circle cx="156" cy="138" r="7" fill="#0d0d15" opacity="0.55"/>
  <circle cx="176" cy="138" r="7" fill="#0d0d15" opacity="0.55"/>
  <!-- Statusleiste -->
  <rect x="142" y="164" width="116" height="6" rx="3" fill="#2f2f45"/>
  <rect x="142" y="164" width="74" height="6" rx="3" fill="url(#p_edge)"/>
  <!-- Fuss -->
  <rect x="150" y="206" width="100" height="7" rx="3" fill="#232333"/>

  <!-- Beschriftung -->
  <text x="200" y="238" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" letter-spacing="3" fill="#8d8da8">20 – 30 B · 13,4 GB</text>
</svg>
